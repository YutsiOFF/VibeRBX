# Publie une release à partir d'une branche « drop/vX.Y.Z » contenant uniquement :
#   version.txt, notes.md, l'installateur découpé (VibeRBX-Setup.exe.part-*)
#   et extra/ (latest.yml + .blockmap lus par la mise à jour automatique de l'app).
# Le code source de VibeRBX n'est jamais présent dans ce dépôt.
name: Publier une release

on:
  push:
    branches: ['drop/**']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Recomposer l'installateur
        id: v
        run: |
          VERSION=$(tr -d ' \r\n' < version.txt)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version.txt invalide"; exit 1; }
          cat $(ls VibeRBX-Setup.exe.part-* | sort) > "VibeRBX-Setup-$VERSION.exe"
          sha256sum "VibeRBX-Setup-$VERSION.exe"
          if [ -f sha256.txt ]; then
            echo "$(cat sha256.txt)  VibeRBX-Setup-$VERSION.exe" | sha256sum -c -
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          EXTRA=$(ls extra/* 2>/dev/null || true)   # latest.yml + .blockmap pour les mises à jour automatiques
          gh release create "v$VERSION" "VibeRBX-Setup-$VERSION.exe" $EXTRA \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title "VibeRBX $VERSION" --notes-file notes.md --latest

      - name: Supprimer la branche temporaire
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --delete "${{ github.ref_name }}"
